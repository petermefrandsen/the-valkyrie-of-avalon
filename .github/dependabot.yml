version: 2

# GitHub Actions are intentionally not listed: every workflow in this repository is managed by
# ghwm (see ghwm.lock) and gets overwritten on `ghwm update`, so action bumps arrive through the
# ghwm-update PR. APM skills get their own update workflow (apm-update).
updates:
  # Keep npm dependencies up to date, all in one pull request
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7        # Wait 7 days before opening PRs — mitigates supply chain attacks
      semver-major-days: 30  # Extra caution for breaking changes
      semver-minor-days: 7
      semver-patch-days: 3   # Security patches still land quickly
    open-pull-requests-limit: 10
    groups:
      # Single group for everything; react and react-dom (exact peer dependency) bump together
      npm-all:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "npm"
    assignees:
      - "petermefrandsen"
